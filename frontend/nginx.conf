# Rendered by the nginx image at start-up (/etc/nginx/templates): ${API_ORIGIN} becomes the API's
# origin, the only place besides this site the page may call.
server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;

  # Text compresses 3-5x; images are already compressed and are left alone.
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # Set once here and never with add_header inside a location: a location's own add_header would
  # silently drop all of these. Caching below uses `expires`, which doesn't interfere.
  # 'unsafe-inline' styles: React and the animations set style attributes.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' ${API_ORIGIN}; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Hashed build assets never change - cache them as long as possible.
  location /assets/ {
    expires max;
  }

  # Tile photos and design art keep their names across deploys - a week, then recheck.
  location ~ ^/(tiles|designs)/ {
    expires 7d;
  }

  # The app shell must always be fresh, or visitors keep loading last deploy's asset names.
  location = /index.html {
    expires -1;
  }

  # Client-side routes (/designer, /login, shared preview links): serve the app shell so a
  # refresh or a pasted link doesn't 404.
  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
