<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Self-hosted variable fonts (see index.css) - preloaded since both render above the
         fold (the hero heading in Cinzel, nav and body text in Outfit). -->
    <link rel="preload" href="/fonts/Cinzel-variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Outfit-variable.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The no-JS/pre-mount fallback. main.tsx removes this title/description/canonical,
         synchronously, before React's first render - see the comment there for why. -->
    <title>Bunakar: Weave Your Own Rug</title>
    <meta
      name="description"
      content="Design a handwoven rug your way: pick a pattern, colors and size, then see it in a real room before it's woven."
    />
    <meta name="author" content="Talmeez Akhtar" />
    <meta name="theme-color" content="#070a16" />
    <link rel="canonical" href="__SITE_URL__/" />
    <!-- Link previews (LinkedIn, WhatsApp, X). __SITE_URL__ is filled in at build time - see vite.config.ts. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bunakar" />
    <meta property="og:title" content="Bunakar: Weave Your Own Rug" />
    <meta property="og:description" content="Design a handwoven rug inspired by Mirzapur's carpet weavers, then see it in a real room." />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Bunakar, design your own handwoven rug, over a golden-domed palace at sunset" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bunakar: Weave Your Own Rug" />
    <meta name="twitter:description" content="Design a handwoven rug inspired by Mirzapur's carpet weavers, then see it in a real room." />
    <meta name="twitter:image" content="__SITE_URL__/og-image.jpg" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebApplication",
            "name": "Bunakar",
            "url": "__SITE_URL__/",
            "applicationCategory": "DesignApplication",
            "operatingSystem": "Web browser",
            "description": "Design a handwoven rug your way: pick a pattern, colors and size, then see it in a real room before it's woven.",
            "image": "__SITE_URL__/og-image.jpg",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
            "creator": { "@type": "Person", "name": "Talmeez Akhtar", "url": "https://talmeezakhtar.github.io/" }
          },
          {
            "@type": "WebSite",
            "name": "Bunakar",
            "url": "__SITE_URL__/"
          }
        ]
      }
    </script>
  </head>
  <body>
    <!-- React replaces all of this the instant it mounts - it's only what a crawler (or a
         visitor) sees for the moment before the bundle runs. Reuses existing Tailwind classes
         rather than new CSS, since Tailwind's already generated them from the real components. -->
    <div id="root">
      <header class="bg-night-950 px-4 py-5 text-center">
        <span class="font-logo text-2xl text-sand-100">Buنakar</span>
      </header>
      <main class="bg-night-950 px-4 py-16 text-center">
        <h1 class="font-display text-3xl text-sand-100 sm:text-4xl">Bunakar &ndash; Design Your Own Handwoven Rug</h1>
        <p class="mx-auto mt-5 max-w-xl text-sand-300/80">
          Design a handwoven rug inspired by the carpet weavers of Mirzapur, India. Pick a pattern, colors and
          size, then preview it in a real room before it's woven.
        </p>
        <nav aria-label="Main" class="mt-8 flex flex-wrap justify-center gap-6 text-sand-300">
          <a href="/#create-design">Start designing a rug</a>
          <a href="/#about-us">About Bunakar</a>
          <a href="/login">Log in</a>
        </nav>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
